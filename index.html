<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#127a8a">
  <meta name="description" content="Build one combined packing list for a trip from reusable templates — organised by when to pack and where things go.">
  <title>AMS Packing List</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AMS Packing List">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash of the wrong colours.
    try { var t = localStorage.getItem('ams-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <main id="app"><!-- screens render here --></main>

  <nav class="tabbar">
    <a href="#/" aria-label="Home"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8h12l-1 12H7Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>
      </svg></span><span>Home</span></a>
    <a href="#/events" aria-label="Events"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/>
      </svg></span><span>Events</span></a>
    <a href="#/lists" aria-label="Templates"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6h11M8 12h11M8 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>
      </svg></span><span>Templates</span></a>
    <a href="#/maintenance" aria-label="Care"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a4 4 0 0 0-5.2 5.1L4 16.9 7.1 20l5.5-5.5a4 4 0 0 0 5.1-5.2l-2.4 2.4-2.1-.6-.6-2.1Z"/>
      </svg></span><span>Care</span></a>
    <a href="#/actions" aria-label="Actions"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/>
      </svg></span><span>Actions</span></a>
    <a href="#/settings" aria-label="Settings"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12,2.5 21.2,7.25 21.2,16.75 12,21.5 2.8,16.75 2.8,7.25"/>
        <circle cx="12" cy="12" r="4"/>
      </svg></span><span>Settings</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
