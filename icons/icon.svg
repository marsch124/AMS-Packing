<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon, drawn by the same freehand pen as the in-app doodles:
       a rucksack out walking — mountains behind, sun up, birds about.
       Light-green ground, deep forest-green ink (cream would wash out on a
       light ground). The rucksack body is FILLED with the
       ground shade so it genuinely stands in front of the mountains rather
       than letting their slopes run through it. Everything sits inside the
       central maskable-safe circle so round-cropped launchers keep the whole
       scene. icon-192.png / icon-512.png are rendered from this file. -->
  <rect width="512" height="512" fill="#a7d69b"/>
  <circle cx="256" cy="248" r="196" fill="#b9e0ac"/>
  <g fill="none" stroke="#2f6b45" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <!-- mountains, sun, birds — the world behind. The peaks sit high so they
         peek over the rucksack's shoulders instead of slashing across it. -->
    <path d="M112,278 C142,222 168,188 194,156 C212,184 227,208 242,234"/>
    <path d="M236,280 C260,234 280,202 304,170 C327,208 345,243 362,280"/>
    <path d="M162,200 C170,208 178,210 186,202 C194,194 200,194 208,201"/>
    <path d="M392,96 C406,95 417,106 416.5,120 C416,134 405,144.5 391.5,144 C378,143.5 367.5,132.5 368,119 C368.5,106 379,95.5 393.5,96.5"/>
    <path d="M391,62 L392,76"/>
    <path d="M428,74 L419,84"/>
    <path d="M446,118 L432,119"/>
    <path d="M429,158 L419,148"/>
    <path d="M356,72 L365,82"/>
    <path d="M338,120 L352,119"/>
    <path d="M108,124 C116,115 126,114 135,120 C143,113 153,112 161,117"/>
    <path d="M146,86 C152,80 159,79 165,83 C171,78 178,77 184,80"/>
  </g>
  <!-- the rucksack body: filled to occlude the mountains, then stroked -->
  <path d="M176,262 C159,294 151,342 155,390 C157,407 168,417 186,419 C232,425 280,425 326,419 C344,417 355,407 357,390 C361,342 353,294 336,262 C298,247 214,247 176,262"
        fill="#b9e0ac" stroke="#2f6b45" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#2f6b45" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <!-- flap, straps, pocket, button -->
    <path d="M178,264 C182,300 192,315 217,321 C246,328 266,328 295,321 C320,315 330,300 334,264"/>
    <path d="M225,303 C224,316 224,328 226,340"/>
    <path d="M287,340 C289,328 289,316 288,303"/>
    <path d="M233,356 C230,374 230,386 234,398 C248,403 264,403 278,398 C282,386 282,374 279,356 C263,352 249,352 233,356"/>
    <path d="M256,373 C256.5,376 256.5,379 256,382"/>
  </g>
</svg>
